<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1e9">
  <title>Daymark — a little less to remember</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #252922;
      --muted: #777d72;
      --line: #e6e9e0;
      --paper: #fff;
      --canvas: #eef1e9;
      --lime: #d8f36a;
      --lime-dark: #455313;
      --coral: #df7057;
      --green: #668453;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--canvas);
      background-image: radial-gradient(#d9ded3 0.7px, transparent 0.7px);
      background-size: 17px 17px;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(100% - 40px, 760px); margin: 0 auto; padding: 34px 0 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 52px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; font-weight: 700; text-decoration: none; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; font-family: "DM Serif Display", Georgia, serif; font-size: 18px; line-height: 1; }
    .today { color: var(--muted); font-size: 13px; }
    .intro { margin-bottom: 27px; }
    .eyebrow { margin: 0 0 9px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    h1 { margin: 0; font-family: "DM Serif Display", Georgia, serif; font-size: clamp(38px, 8vw, 54px); font-weight: 400; line-height: 1.05; letter-spacing: 0; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .workspace { overflow: hidden; border: 1px solid #e1e5db; border-radius: 8px; background: var(--paper); box-shadow: 0 18px 55px #38402a0d; }
    .add-form { display: flex; gap: 12px; padding: 18px; border-bottom: 1px solid var(--line); }
    .add-form input { min-width: 0; flex: 1; height: 48px; padding: 0 15px; border: 1px solid #e4e7df; border-radius: 5px; outline: none; background: #fafbf8; color: var(--ink); font-size: 14px; transition: border-color 150ms, box-shadow 150ms; }
    .add-form input::placeholder { color: #9a9f95; }
    .add-form input:focus { border-color: #9daf61; box-shadow: 0 0 0 3px #d8f36a55; }
    .add-button { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 8px; min-width: 112px; padding: 0 17px; border: 0; border-radius: 5px; background: var(--lime); color: #293116; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 150ms, transform 150ms; }
    .add-button:hover { background: #c9e557; }
    .add-button:active { transform: translateY(1px); }
    .add-button svg { width: 16px; height: 16px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 20px 12px; }
    .filters { display: flex; align-items: center; gap: 4px; }
    .filter { min-height: 34px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .filter:hover { background: #f5f6f1; color: var(--ink); }
    .filter[aria-pressed="true"] { background: #f0f3e8; color: var(--ink); }
    .summary { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .tasks { min-height: 210px; padding: 0 20px; }
    .task { display: flex; align-items: center; gap: 13px; min-height: 61px; border-bottom: 1px solid #eff0ec; animation: arrive 220ms ease-out both; }
    .task:last-child { border-bottom: 0; }
    .task-check { position: relative; display: grid; flex: 0 0 20px; width: 20px; height: 20px; place-items: center; padding: 0; border: 1.5px solid #c8cec0; border-radius: 50%; background: transparent; cursor: pointer; transition: border-color 150ms, background 150ms; }
    .task-check:hover { border-color: var(--green); }
    .task-check svg { width: 12px; height: 12px; opacity: 0; color: white; }
    .task.is-done .task-check { border-color: var(--green); background: var(--green); }
    .task.is-done .task-check svg { opacity: 1; }
    .task-text { min-width: 0; flex: 1; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; }
    .task.is-done .task-text { color: #969b91; text-decoration: line-through; text-decoration-color: #b7bcb2; }
    .delete-button { display: grid; flex: 0 0 32px; width: 32px; height: 32px; place-items: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #a3a89e; cursor: pointer; opacity: 0; transition: color 150ms, background 150ms, opacity 150ms; }
    .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: #fff0ed; color: var(--coral); }
    .delete-button svg { width: 16px; height: 16px; }
    .empty-state { display: grid; min-height: 210px; align-content: center; justify-items: center; text-align: center; }
    .empty-mark { display: grid; width: 40px; height: 40px; place-items: center; margin-bottom: 12px; border-radius: 50%; background: #f1f4e8; color: var(--green); }
    .empty-mark svg { width: 20px; height: 20px; }
    .empty-title { margin: 0; font-family: "DM Serif Display", Georgia, serif; font-size: 20px; font-weight: 400; }
    .empty-copy { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 51px; padding: 0 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .progress-wrap { display: flex; align-items: center; gap: 9px; }
    .progress { width: 74px; height: 4px; overflow: hidden; border-radius: 5px; background: #e9ece4; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width 220ms ease; }
    .clear-button { padding: 6px 0; border: 0; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
    .clear-button:hover { color: var(--coral); }
    .clear-button:disabled { cursor: default; opacity: .45; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 2; padding: 11px 15px; border: 1px solid #f0c7bc; border-radius: 5px; background: #fff7f4; color: #8c3e2d; font-size: 13px; box-shadow: 0 8px 24px #25292216; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) {
      .shell { width: min(100% - 28px, 760px); padding-top: 23px; }
      .topbar { margin-bottom: 38px; }
      .add-form { gap: 8px; padding: 13px; }
      .add-button { min-width: 48px; padding: 0 14px; }
      .add-button .button-label { display: none; }
      .list-header { align-items: flex-start; padding: 13px 12px 9px; }
      .filters { gap: 0; }
      .filter { padding: 0 9px; }
      .summary { padding-top: 9px; font-size: 11px; }
      .tasks { padding: 0 14px; }
      .footer { padding: 0 14px; }
      .delete-button { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true">d</span>
        <span>daymark</span>
      </a>
      <time class="today" id="today"></time>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Your day, at a glance</p>
      <h1 id="page-title">A little less<br>to remember.</h1>
      <p class="subtitle">A clear mind starts with a short list.</p>
    </section>

    <section class="workspace" aria-label="Your tasks">
      <form class="add-form" id="add-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <input id="task-input" name="task" type="text" maxlength="200" placeholder="What needs doing?" autocomplete="off" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="button-label">Add task</span>
        </button>
      </form>

      <div class="list-header">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Open</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
        <span class="summary" id="summary" aria-live="polite"></span>
      </div>

      <div class="tasks" id="tasks" aria-live="polite"></div>

      <footer class="footer">
        <div class="progress-wrap">
          <div class="progress" role="progressbar" id="progress" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
          <span id="progress-label">0% done</span>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
    <p class="sr-only" id="storage-note" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "daymark-tasks-v1";
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#task-input");
      const tasksElement = document.querySelector("#tasks");
      const summaryElement = document.querySelector("#summary");
      const progressElement = document.querySelector("#progress");
      const progressFill = document.querySelector("#progress-fill");
      const progressLabel = document.querySelector("#progress-label");
      const clearButton = document.querySelector("#clear-completed");
      const storageNote = document.querySelector("#storage-note");
      const filters = [...document.querySelectorAll("[data-filter]")];
      let activeFilter = "all";
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved)
            ? saved.filter(task => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
            : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          storageNote.textContent = "Tasks saved on this device.";
          return true;
        } catch {
          storageNote.textContent = "Unable to save tasks. Your browser storage may be full or disabled.";
          showStorageError();
          return false;
        }
      }

      function showStorageError() {
        if (document.querySelector(".toast")) return;
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.setAttribute("role", "alert");
        toast.textContent = "Could not save changes to this browser.";
        document.body.append(toast);
        window.setTimeout(() => toast.remove(), 3500);
      }

      function makeIcon(markup) {
        const template = document.createElement("template");
        template.innerHTML = markup;
        return template.content.firstElementChild;
      }

      function render() {
        const completedCount = tasks.filter(task => task.completed).length;
        const openCount = tasks.length - completedCount;
        const visibleTasks = tasks.filter(task => activeFilter === "all" || (activeFilter === "active" && !task.completed) || (activeFilter === "completed" && task.completed));
        summaryElement.textContent = `${openCount} ${openCount === 1 ? "task" : "tasks"} left`;
        const percentage = tasks.length ? Math.round(completedCount / tasks.length * 100) : 0;
        progressFill.style.width = `${percentage}%`;
        progressElement.setAttribute("aria-valuenow", String(percentage));
        progressLabel.textContent = `${percentage}% done`;
        clearButton.disabled = completedCount === 0;
        filters.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));

        tasksElement.replaceChildren();
        if (visibleTasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const mark = document.createElement("span");
          mark.className = "empty-mark";
          mark.setAttribute("aria-hidden", "true");
          mark.append(makeIcon('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>'));
          const title = document.createElement("p");
          title.className = "empty-title";
          title.textContent = activeFilter === "completed" ? "Nothing finished just yet." : activeFilter === "active" ? "All caught up." : "Make room for what matters.";
          const copy = document.createElement("p");
          copy.className = "empty-copy";
          copy.textContent = activeFilter === "active" && tasks.length ? "Enjoy the clear space." : "Add a task above to get started.";
          empty.append(mark, title, copy);
          tasksElement.append(empty);
          return;
        }

        visibleTasks.forEach(task => {
          const row = document.createElement("div");
          row.className = `task${task.completed ? " is-done" : ""}`;
          const check = document.createElement("button");
          check.className = "task-check";
          check.type = "button";
          check.setAttribute("aria-label", task.completed ? `Mark ${task.text} as open` : `Complete ${task.text}`);
          check.setAttribute("aria-pressed", String(task.completed));
          check.append(makeIcon('<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 3.2 3.2L13 4.5"/></svg>'));
          check.addEventListener("click", () => {
            task.completed = !task.completed;
            saveTasks();
            render();
          });
          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;
          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete ${task.text}`);
          remove.append(makeIcon('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>'));
          remove.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            render();
          });
          row.append(check, text, remove);
          tasksElement.append(row);
        });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        tasks.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, text, completed: false });
        saveTasks();
        activeFilter = "all";
        input.value = "";
        render();
        input.focus();
      });

      filters.forEach(button => button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        render();
      }));

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date());
      render();
    })();
  </script>
</body>
</html>
